<style>
  :root {
    --indigo:#32305C; --yellow:#FFC72C; --linen:#F5EFE6;
    --peach:#F0855C; --coral:#E8614A;
  }
  * { box-sizing:border-box; margin:0; padding:0; }
  html,body { height:100%; overflow-x:hidden; }
  body {
    font-family:'Open Sans',system-ui,sans-serif;
    background:
      radial-gradient(1200px 600px at 50% -10%, #3d3a6e 0%, transparent 60%),
      linear-gradient(160deg, #3a3768 0%, var(--indigo) 55%, #26244a 100%);
    color:#fff; min-height:100%;
    display:flex; align-items:center; justify-content:center;
    padding:32px; text-align:center;
    -webkit-font-smoothing:antialiased;
  }
  .card { max-width:520px; width:100%; overflow-wrap:break-word; }
  .logo { width:130px; height:auto; opacity:.96; margin:0 auto 40px; display:block; }
  .eyebrow {
    font-family:'Raleway',sans-serif; font-weight:800;
    letter-spacing:.28em; text-transform:uppercase;
    font-size:.72rem; color:var(--peach); margin-bottom:22px;
  }
  h1 {
    font-family:'Raleway',sans-serif; font-weight:900;
    font-size:clamp(2.1rem,7vw,3.1rem); line-height:1.08;
    margin-bottom:8px;
  }
  h1 .hl { color:var(--yellow); }
  .rule {
    width:64px; height:4px; border-radius:4px;
    background:linear-gradient(90deg,var(--peach),var(--coral));
    margin:26px auto 26px;
  }
  p.lead {
    font-size:clamp(1rem,3.6vw,1.18rem); line-height:1.6;
    color:rgba(255,255,255,.9); max-width:440px; margin:0 auto;
  }
  p.lead b { color:#fff; font-weight:600; }
  .foot {
    margin-top:44px; font-size:.72rem; letter-spacing:.14em;
    text-transform:uppercase; color:rgba(255,255,255,.45);
    font-family:'Raleway',sans-serif; font-weight:600;
  }
</style>
